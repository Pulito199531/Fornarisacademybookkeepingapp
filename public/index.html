<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledgerline — Bookkeeping</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body>
<div id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">Ledgerline <span class="mark">MVP</span></div>
    <div id="userBadge" style="font-size:12px; color:rgba(237,239,234,0.7); display:flex; justify-content:space-between; align-items:center;">
      <span id="userEmail"></span>
      <a href="#" id="logoutLink" style="color:var(--ochre); font-size:11px;">Sign out</a>
    </div>

    <button id="practiceBtn" class="business-picker button" style="width:100%; text-align:left; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.2); color:#EDEFEA; padding:9px 12px; border-radius:4px; font-size:12.5px; cursor:pointer; margin-bottom:2px;">⊞ All clients overview</button>

    <div class="business-picker">
      <label class="field-label" style="color:rgba(237,239,234,0.6)">Business</label>
      <select id="businessSelect"></select>
      <button id="newBusinessBtn">+ New business</button>
    </div>

    <nav class="tabs" id="tabs">
      <button data-tab="dashboard" class="active"><span class="num">01</span> Dashboard</button>
      <button data-tab="accounts"><span class="num">02</span> Chart of Accounts</button>
      <button data-tab="invoicing"><span class="num">03</span> Invoicing</button>
      <button data-tab="import"><span class="num">04</span> Import Statement</button>
      <button data-tab="transactions"><span class="num">05</span> Transactions</button>
      <button data-tab="reconciliation"><span class="num">06</span> Reconciliation</button>
      <button data-tab="reports"><span class="num">07</span> Reports</button>
      <button data-tab="taxes"><span class="num">08</span> Estimated Taxes</button>
      <button data-tab="team"><span class="num">09</span> Team &amp; Access</button>
    </nav>

    <div class="sidebar-footer">Ledgerline — local prototype build</div>
  </aside>

  <main id="main"></main>
</div>

<script src="app.js"></script>
</body>
</html>
